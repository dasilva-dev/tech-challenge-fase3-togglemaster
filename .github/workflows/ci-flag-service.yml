name: CI/CD Flag Service (DevSecOps & GitOps)

on:
  push:
    branches: [main]
    paths:
      - 'services/flag-service/**'
      - '.github/workflows/ci-flag-service.yml'
  pull_request:
    branches: [main]
    paths:
      - 'services/flag-service/**'
      - '.github/workflows/ci-flag-service.yml'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  security-events: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: togglemaster/flag-service
  SERVICE_DIR: services/flag-service
  GITOPS_DEPLOYMENT_FILE: gitops/apps/flag-service/deployment.yaml

jobs:
  # --------------------------------------------------------------------------
  # 1. BUILD & UNIT TEST
  # --------------------------------------------------------------------------
  build-and-test:
    name: 1. Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ${{ env.SERVICE_DIR }}/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.SERVICE_DIR }}/requirements.txt

      - name: Run Unit Tests
        run: |
          python -m unittest discover -s ${{ env.SERVICE_DIR }} -p 'test_*.py'

  # --------------------------------------------------------------------------
  # 2. LINTER & STATIC ANALYSIS
  # --------------------------------------------------------------------------
  linter:
    name: 2. Linter & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Flake8
        run: |
          pip install flake8

      - name: Run Flake8 Linter
        run: |
          # Checagem de erros críticos de sintaxe e estilo PEP8
          flake8 ${{ env.SERVICE_DIR }} --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 ${{ env.SERVICE_DIR }} --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # --------------------------------------------------------------------------
  # 3. SECURITY SCAN (SCA & SAST COM REGRA DE BLOQUEIO)
  # --------------------------------------------------------------------------
  security-scan:
    name: 3. Security Scan (SCA & SAST)
    needs: [build-and-test, linter]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # SCA: Software Composition Analysis (Trivy fs)
      - name: Run SCA (Trivy FS Scan)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: ${{ env.SERVICE_DIR }}
          format: 'table'
          exit-code: '1' # Falha o pipeline se encontrar vulnerabilidade CRÍTICA nas dependências
          ignore-unfixed: true
          severity: 'CRITICAL'

      # SAST: Static Application Security Testing (Bandit)
      - name: Run SAST (Bandit)
        run: |
          pip install bandit
          bandit -r ${{ env.SERVICE_DIR }} -ll

  # --------------------------------------------------------------------------
  # 4. DOCKER BUILD, CONTAINER SCAN & PUSH TO ECR
  # --------------------------------------------------------------------------
  docker-build-and-push:
    name: 4. Docker Build, Scan & Push
    needs: [security-scan]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
      ecr_image: ${{ steps.vars.outputs.ecr_image }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Image Tag
        id: vars
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TAG="v1.0.0-${SHORT_SHA}"
          echo "image_tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          FULL_IMAGE="${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.image_tag }}"
          docker build -t "$FULL_IMAGE" -t "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest" ${{ env.SERVICE_DIR }}
          echo "ecr_image=$FULL_IMAGE" >> "$GITHUB_OUTPUT"
        id: docker-build

      # Container Security Scan (Trivy Image Scan)
      - name: Run Container Scan (Trivy Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.image_tag }}"
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      - name: Ensure ECR Repository Exists
        run: |
          aws ecr describe-repositories --repository-names ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} || aws ecr create-repository --repository-name ${{ env.ECR_REPOSITORY }} --region ${{ env.AWS_REGION }} --image-tag-mutability MUTABLE

      - name: Push Image to Amazon ECR
        run: |
          docker push "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.image_tag }}"
          docker push "${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest"

  # --------------------------------------------------------------------------
  # 5. GITOPS AUTO-UPDATE (ATUALIZAÇÃO DE TAG NO ARQUIVO DEPLOYMENT.YAML)
  # --------------------------------------------------------------------------
  gitops-update:
    name: 5. GitOps Auto-Update
    needs: [docker-build-and-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Image in GitOps Deployment Manifest
        run: |
          NEW_IMAGE="${{ needs.docker-build-and-push.outputs.ecr_image }}"
          echo "Atualizando manifest GitOps com a nova imagem: $NEW_IMAGE"
          sed -i "s|image: .*togglemaster/flag-service:.*|image: ${NEW_IMAGE}|g" ${{ env.GITOPS_DEPLOYMENT_FILE }}
          git diff ${{ env.GITOPS_DEPLOYMENT_FILE }}

      - name: Commit and Push Manifest Update
        run: |
          git config --global user.name "CI-Runner"
          git config --global user.email "ci-runner@users.noreply.github.com"
          git add ${{ env.GITOPS_DEPLOYMENT_FILE }}
          if git diff-index --quiet HEAD; then
            echo "Nenhuma alteracao detectada no manifesto GitOps."
          else
            git commit -m "chore(gitops): update flag-service image to ${{ needs.docker-build-and-push.outputs.image_tag }} [skip ci]"
            git push origin main
          fi
