# ==============================================================================
# ArgoCD Applications - Padrão GitOps ToggleMaster
# Sincronização automatizada para os 5 microsserviços e base
# ==============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: togglemaster-base
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/FIAP-TCs/togglemaster.git
    targetRevision: HEAD
    path: gitops/apps/base
  destination:
    server: https://kubernetes.default.svc
    namespace: togglemaster
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true

